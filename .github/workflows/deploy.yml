name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build
        env:
          TYASHIN_API_KEY: ${{ secrets.TYASHIN_API_KEY }}
          TYASHIN_API_URL: https://website-api.tyashin.com
          TYASHIN_STOREFRONT_URL: https://website-api.tyashin.com/api/v1/public/ecommerce
          PROJECT_ID: 6a1c9aa66933b758bf066427
          SITE_DOMAIN: woodlark.com
          ROBOTS_NOINDEX: 'true'
        run: npx @opennextjs/cloudflare build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx @opennextjs/cloudflare deploy
